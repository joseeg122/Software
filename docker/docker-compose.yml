# FinTrack 360 — PROTOTIPO EDUCATIVO, DATOS COMPLETAMENTE SIMULADOS.
# Los secretos se leen de docker/.env (copia .env.example o ejecuta scripts/iniciar.ps1).
name: fintrack360

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fintrack
      POSTGRES_USER: ${DB_USER:-fintrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en docker/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d fintrack"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ../backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/fintrack
      DB_USER: ${DB_USER:-fintrack}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en docker/.env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en docker/.env}
      APP_DEMO_USER: ${APP_DEMO_USER:-analista}
      APP_DEMO_PASSWORD: ${APP_DEMO_PASSWORD:?Define APP_DEMO_PASSWORD en docker/.env}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      TZ: America/Bogota
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ../frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db-data:
