# FinTrack 360 — PROTOTIPO EDUCATIVO, DATOS COMPLETAMENTE SIMULADOS.
# Los secretos llegan solo por variables de entorno (ver docker/.env.example).
spring:
  application:
    name: fintrack360
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fintrack}
    username: ${DB_USER:fintrack}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  demo:
    username: ${APP_DEMO_USER:analista}
    password: ${APP_DEMO_PASSWORD}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
